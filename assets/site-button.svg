<svg xmlns="http://www.w3.org/2000/svg" width="500" height="104" viewBox="0 0 500 104" role="img" aria-label="Visit the TigerQR Label site">
  <title>Visit the TigerQR Label site</title>
  <defs>
    <linearGradient id="tsFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262a33"/>
      <stop offset="1" stop-color="#16181d"/>
    </linearGradient>
    <linearGradient id="tsGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="496" height="100" rx="50" fill="url(#tsFill)"/>
  <rect x="2" y="2" width="496" height="50" rx="50" fill="url(#tsGloss)"/>
  <rect x="2.5" y="2.5" width="495" height="99" rx="49.5" fill="none" stroke="#f58220" stroke-opacity="0.9"/>

  <!-- A page: the reference site. -->
  <g transform="translate(44 32)" fill="none" stroke="#ffffff" stroke-width="3.2"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="1.6" y="1.6" width="36.8" height="36.8" rx="8"/>
    <path d="M1.6 12h36.8M10 21h20M10 29h13"/>
  </g>

  <text x="106" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Visit the TigerQR Label site</text>
  <text x="106" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="14.5" font-weight="500" fill="#ffffff" fill-opacity="0.88">Links, formats, link generator, label API</text>

  <path d="M454 40 l12 12 l-12 12" fill="none" stroke="#ffffff" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
</svg>
