<svg xmlns="http://www.w3.org/2000/svg" width="540" height="104" viewBox="0 0 540 104" role="img" aria-label="Open the TigerQR Playground">
  <title>Open the TigerQR Playground</title>
  <defs>
    <linearGradient id="pgFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a2b"/>
      <stop offset="0.55" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#e6352b"/>
    </linearGradient>
    <linearGradient id="pgGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="536" height="100" rx="50" fill="url(#pgFill)"/>
  <rect x="2" y="2" width="536" height="50" rx="50" fill="url(#pgGloss)"/>
  <rect x="2.5" y="2.5" width="535" height="99" rx="49.5" fill="none" stroke="#ffffff" stroke-opacity="0.30"/>

  <!-- A QR code: the playground draws the labels. -->
  <g transform="translate(44 32)" fill="none" stroke="#ffffff" stroke-width="3.2"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="1.6" y="1.6" width="14" height="14" rx="2.5"/>
    <rect x="24.4" y="1.6" width="14" height="14" rx="2.5"/>
    <rect x="1.6" y="24.4" width="14" height="14" rx="2.5"/>
    <path d="M24.4 24.4h6v6h-6zM38.4 24.4v.1M24.4 38.4h.1M31 38.4h7.4v-7"/>
  </g>

  <text x="106" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Open the TigerQR Playground</text>
  <text x="106" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="14.5" font-weight="500" fill="#ffffff" fill-opacity="0.88">Every format of a label, PNG and SVG</text>

  <path d="M494 40 l12 12 l-12 12" fill="none" stroke="#ffffff" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
</svg>
